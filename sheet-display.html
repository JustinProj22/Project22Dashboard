<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Project 22 — Sheet Display</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black:     #0a0a0a;
    --dark:      #111111;
    --panel:     #1a1a1a;
    --border:    #2a2a2a;
    --orange:    #f5a623;
    --white:     #f0f0f0;
    --muted:     #666;
    --red:       #e04444;
    --green:     #4caf7d;
    --row-hover: #1c1c1c;
    --header-h:  56px;

    /* Portrait TV tweaks — scale up text slightly since we have more vertical room */
    --table-font: 15px;
    --th-font: 13px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
  }

  /* ══ SPINNER ═════════════════════════════════════════════════ */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══ TOP HEADER BAR ══════════════════════════════════════════ */
  .topbar {
    height: var(--header-h);
    background: var(--dark);
    border-bottom: 2px solid var(--orange);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }

  .topbar-logo { display: flex; align-items: center; overflow: visible; }
  .topbar-logo svg { height: 34px; width: auto; display: block; overflow: visible; }

  .topbar-clock {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 600;
    letter-spacing: 2px; color: var(--white);
    text-align: right; line-height: 1.1;
  }
  .topbar-clock .date-line {
    font-size: 11px; font-weight: 400;
    color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
  }

  /* ══ MAIN LAYOUT ═════════════════════════════════════════════ */
  .page {
    position: fixed;
    top: var(--header-h);
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Sub-header strip — matches .jobs-header */
  .table-header {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 2px solid var(--orange);
    flex-shrink: 0;
  }

  .table-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 14px;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--orange);
  }

  .table-meta {
    font-size: 12px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }

  /* ══ SCROLLABLE TABLE BODY ═══════════════════════════════════ */
  .table-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;

    /* Keyboard / remote scroll: give it focus so arrow keys work */
    outline: none;
  }

  /* Custom scrollbar — matches existing dashboard */
  .table-body::-webkit-scrollbar       { width: 5px; height: 5px; }
  .table-body::-webkit-scrollbar-track { background: var(--dark); }
  .table-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .table-body::-webkit-scrollbar-thumb:hover { background: var(--orange); }

  /* ══ TABLE ═══════════════════════════════════════════════════ */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--table-font);
  }

  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel);
    color: var(--orange);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: var(--th-font);
    letter-spacing: 1px; text-transform: uppercase;
    padding: 10px 16px; text-align: left;
    border-bottom: 1px solid var(--orange);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:hover { background: var(--row-hover); }

  /* Highlight focused row (keyboard nav) */
  tbody tr.focused { background: rgba(245,166,35,0.07); outline: none; }
  tbody tr.focused td:first-child {
    border-left: 3px solid var(--orange);
  }

  tbody td {
    padding: 10px 16px;
    vertical-align: middle;
    color: var(--white);
    line-height: 1.35;
  }

  /* First column — slightly bolder */
  tbody td:first-child {
    font-weight: 600;
    color: var(--white);
    border-left: 3px solid transparent;
  }

  /* Status / tick columns */
  .status-yes { color: var(--green); font-size: 16px; }
  .status-no  { color: var(--red);   font-size: 16px; }
  .status-na  { color: var(--muted); }

  /* Tag-style values */
  .cell-tag {
    display: inline-block;
    background: rgba(245,166,35,0.12);
    color: var(--orange);
    border: 1px solid rgba(245,166,35,0.25);
    padding: 2px 8px; border-radius: 3px;
    font-size: 12px; font-weight: 600;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }

  /* Date styling */
  .has-date { color: var(--green); font-weight: 500; }
  .no-date  { color: var(--red);   font-weight: 700; }

  /* ══ LOADING / EMPTY STATES ══════════════════════════════════ */
  .loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 20px;
    color: var(--muted); padding-bottom: 60px;
  }

  .spinner-wrap {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
  }
  .spinner-wrap svg { width: 56px; height: 56px; display: block; }

  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--muted);
    font-size: 14px; font-style: italic;
  }

  .error-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--red);
    font-size: 14px;
  }

  /* ══ PORTRAIT TV SCALING ══════════════════════════════════════
     A portrait 4K TV running at native resolution would be
     3840×2160 rotated → 2160px wide × 3840px tall.
     Most TV browsers report a more typical CSS pixel width.
     We target ~1080px logical width; zoom slightly to fill the
     portrait viewport and make text comfortable to read from
     across a room.
  ════════════════════════════════════════════════════════════ */
  @media (orientation: portrait) and (min-width: 769px) {
    :root {
      --table-font: 18px;
      --th-font:    14px;
      --header-h:   64px;
    }
    .topbar-logo svg  { height: 38px; }
    .topbar-clock     { font-size: 26px; }
    .table-header     { height: 50px; }
    .table-title      { font-size: 16px; }
    thead th          { padding: 12px 20px; }
    tbody td          { padding: 13px 20px; }

    /* Wider row padding for portrait — plenty of horizontal space */
    html { zoom: 100%; }
  }

  /* Landscape TV (existing dashboard style) */
  @media (orientation: landscape) and (min-width: 769px) {
    html { zoom: 75%; }
  }

  /* ══ SCROLL HINT BAR ══════════════════════════════════════════
     Subtle fixed hint at the bottom so operators know it scrolls
  ════════════════════════════════════════════════════════════ */
  .scroll-hint {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(transparent, rgba(10,10,10,0.95));
    font-size: 11px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px; text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .scroll-hint.hidden { opacity: 0; }

  /* ══ COLUMN HEADER CUSTOMISATION ══════════════════════════════
     Adjust min-widths so columns don't crush on portrait width.
     Column order: A B C D E F G I (skipping H)
  ════════════════════════════════════════════════════════════ */
  .col-a { min-width: 90px;  }  /* Job #        */
  .col-b { min-width: 80px;  }  /* List #        */
  .col-c { min-width: 260px; }  /* Joinery Item  */
  .col-d { min-width: 120px; }  /* Listed By     */
  .col-e { min-width: 110px; }  /* Machined      */
  .col-f { min-width: 130px; }  /* Assigned To   */
  .col-g { min-width: 110px; }  /* Assembled     */
  .col-i { min-width: 130px; }  /* Date Required */
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURATION — edit these values to match your setup
// ══════════════════════════════════════════════════════════════

// Same Apps Script deployment URL as the main dashboard
var API_URL = 'https://script.google.com/macros/s/AKfycbwaM7Vh2GV6zl0xYaA2on6IW12bPVgE6tyBp7xl4TsJl3QwdW-APvxhGEKRNHCL6LZ5/exec';

// The sheet name to read (different tab in the same Google Sheet)
var SHEET_NAME = 'Active Jobs'; // ← change to your actual sheet tab name

// Display title shown in the sub-header
var DISPLAY_TITLE = 'Factory Floor Schedule'; // ← change as needed

// Column labels — 8 columns: A B C D E F G I (skipping H)
var COLUMN_HEADERS = [
  'Job #',         // Col A
  'List #',        // Col B
  'Joinery Item',  // Col C
  'Listed By',     // Col D
  'Machined',      // Col E  (Checkbox)
  'Assigned To',   // Col F
  'Assembled',     // Col G  (Checkbox)
  'Date Required'  // Col I  (H is skipped)
];

// Column index of any "date" columns (0-based, matching COLUMN_HEADERS above)
var DATE_COLUMNS = [7]; // Col I — Date Required

// Column index of any yes/no tick columns (0-based)
var TICK_COLUMNS = [4, 6]; // Col E — Machined, Col G — Assembled

// How often to refresh the data (milliseconds). 30s matches the main dashboard.
var REFRESH_INTERVAL = 30000;

// ══════════════════════════════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════════════════════════════
function updateClock() {
  var now  = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var s = String(now.getSeconds()).padStart(2,'0');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-time').textContent = h+':'+m+':'+s;
  document.getElementById('clock-date').textContent =
    days[now.getDay()]+' '+now.getDate()+' '+mons[now.getMonth()]+' '+now.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);

// ══════════════════════════════════════════════════════════════
//  KEYBOARD / REMOTE SCROLL
//  The .table-body div has tabindex="0" — click or auto-focus it
//  so arrow keys, Page Up/Down, Home/End all scroll it natively.
// ══════════════════════════════════════════════════════════════
var tableBody = document.getElementById('table-body');

// Auto-focus once page loads so remotes work immediately
window.addEventListener('load', function() {
  tableBody.focus();
});

// Re-focus if user clicks anywhere on the page (except interactive elements)
document.body.addEventListener('click', function(e) {
  if (!e.target.closest('button, a, input, select')) {
    tableBody.focus();
  }
});

// Scroll hint — hide when user has scrolled past the first screenful
tableBody.addEventListener('scroll', function() {
  var hint = document.getElementById('scroll-hint');
  if (tableBody.scrollTop > 80) {
    hint.classList.add('hidden');
  } else {
    hint.classList.remove('hidden');
  }
});

// ══════════════════════════════════════════════════════════════
//  FULLSCREEN (TV Bro / portrait TV)
// ══════════════════════════════════════════════════════════════
window.addEventListener('load', function() {
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
  else if (el.msRequestFullscreen)     el.msRequestFullscreen();
});

// ══════════════════════════════════════════════════════════════
//  BUILD COLUMN HEADERS
// ══════════════════════════════════════════════════════════════
var colClasses = ['col-a','col-b','col-c','col-d','col-e','col-f','col-g','col-i'];

(function buildHeaders() {
  var tr = document.getElementById('thead-row');
  COLUMN_HEADERS.forEach(function(label, i) {
    var th = document.createElement('th');
    th.textContent = label;
    th.className = colClasses[i] || '';
    tr.appendChild(th);
  });
})();

// ══════════════════════════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════════════════════════
var _lastHash = '';

function loadSheet() {
  var url = API_URL + '?action=sheetDisplay&sheet=' + encodeURIComponent(SHEET_NAME);

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(data) { renderSheet(data); })
    .catch(function(err) {
      console.error('Sheet load error:', err);
      showError();
    });
}

function renderSheet(data) {
  // data should be an array of row arrays: [[a,b,c,d,e,f,g,i], ...]
  // The Apps Script action returns rows from row 3, columns A-G and I (skipping H)

  var hash = JSON.stringify(data);
  if (hash === _lastHash) return; // no change — skip re-render
  _lastHash = hash;

  var loading = document.getElementById('loading-state');
  var table   = document.getElementById('data-table');
  var tbody   = document.getElementById('data-tbody');
  var meta    = document.getElementById('sheet-meta');
  var title   = document.getElementById('sheet-title');

  title.textContent = DISPLAY_TITLE;
  loading.style.display = 'none';

  if (!data || !Array.isArray(data) || data.length === 0) {
    table.style.display = 'none';
    var emptyDiv = document.createElement('div');
    emptyDiv.className = 'empty-state';
    emptyDiv.textContent = 'No data found in sheet.';
    tableBody.appendChild(emptyDiv);
    meta.textContent = '0 rows';
    return;
  }

  tbody.innerHTML = '';

  var rowCount = 0;

  data.forEach(function(row) {
    // Skip completely empty rows
    if (!row || row.every(function(c) { return !c && c !== 0; })) return;

    rowCount++;
    var tr = document.createElement('tr');

    row.forEach(function(cell, colIdx) {
      var td = document.createElement('td');
      td.className = colClasses[colIdx] || '';

      var val = cell == null ? '' : String(cell).trim();

      if (TICK_COLUMNS.indexOf(colIdx) !== -1) {
        // Yes/No tick rendering
        td.innerHTML = renderTick(val);
      } else if (DATE_COLUMNS.indexOf(colIdx) !== -1) {
        // Date rendering
        td.innerHTML = val
          ? '<span class="has-date">' + esc(val) + '</span>'
          : '<span class="no-date">No Date</span>';
      } else if (val === '') {
        td.innerHTML = '<span class="status-na">—</span>';
      } else {
        td.textContent = val;
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  meta.textContent = rowCount + ' row' + (rowCount !== 1 ? 's' : '');
  table.style.display = 'table';

  // Update scroll hint visibility
  var hint = document.getElementById('scroll-hint');
  if (tableBody.scrollHeight <= tableBody.clientHeight) {
    hint.classList.add('hidden');
  } else {
    hint.classList.remove('hidden');
  }

  // Re-focus so keyboard still works after refresh
  tableBody.focus({ preventScroll: true });
}

function renderTick(val) {
  var s = val.toLowerCase();
  if (s === 'true' || s === 'yes' || s === '1' || s === '✓' || s === 'y') {
    return '<span class="status-yes">✓</span>';
  }
  if (s === 'false' || s === 'no' || s === '0' || s === '✗' || s === 'n' || s === '') {
    return '<span class="status-no">✗</span>';
  }
  // Treat as a tag if it has text content (e.g. a name)
  return '<span class="cell-tag">' + esc(val) + '</span>';
}

function showError() {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('sheet-title').textContent = DISPLAY_TITLE;
  var errDiv = document.createElement('div');
  errDiv.className = 'error-state';
  errDiv.textContent = 'Error loading data — check the API and sheet name.';
  tableBody.appendChild(errDiv);
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Initial load + auto-refresh ──────────────────────────────
loadSheet();
setInterval(loadSheet, REFRESH_INTERVAL);
</script>
</body>
</html>
