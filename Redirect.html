<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Notify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 36px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .icon { font-size: 64px; margin-bottom: 16px; }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.5;
    }

    .time {
      margin-top: 16px;
      font-size: 12px;
      color: #bbb;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error h2 { color: #cc0000; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <h2>Sending…</h2>
    <p>Please wait</p>
  </div>

  <script>
    // ============================================================
    // REPLACE WITH YOUR APPS SCRIPT WEB APP URL
    // ============================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzV2nYwwHqb57gn35sVT-g4s_63DoKAsNsQpYdRo_XSDQTlIfo9JaRpqPefuYLwEMNZ/exec";
    // ============================================================

    const params = new URLSearchParams(window.location.search);
    const bench = params.get("bench");
    const office = params.get("office");
    const card = document.getElementById("card");

    function showSuccess(bench, office) {
      const now = new Date();
      const timestamp = now.toLocaleDateString('en-GB') + ' ' +
        now.toLocaleTimeString('en-GB');
      card.innerHTML = `
        <div class="icon">✅</div>
        <h2>Message Sent!</h2>
        <p>Hey <strong>${office}</strong>,<br>${bench} would like to see you.</p>
        <div class="time">${timestamp}</div>
      `;
    }

    function showError(msg) {
      card.classList.add("error");
      card.innerHTML = `
        <div class="icon">❌</div>
        <h2>Something went wrong</h2>
        <p>${msg}</p>
      `;
    }

    function showInvalid() {
      card.classList.add("error");
      card.innerHTML = `
        <div class="icon">❌</div>
        <h2>Invalid QR Code</h2>
        <p>Missing worker information.</p>
      `;
    }

    async function sendMessage() {
      if (!bench || !office) {
        showInvalid();
        return;
      }

      const url = APPS_SCRIPT_URL
        + "?bench=" + encodeURIComponent(bench)
        + "&office=" + encodeURIComponent(office);

      try {
        // fetch() with no-cors sends the request without following Google's
        // login redirects — the script still executes on Google's servers
        await fetch(url, { method: "GET", mode: "no-cors" });

        // Show success immediately — script has been triggered
        showSuccess(bench, office);
      } catch (err) {
        showError("Could not reach the server. Check your connection and try again.");
      }
    }

    sendMessage();
  </script>
</body>
</html>
