<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC — Redirecting…</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
      text-align: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <strong>Sending message…</strong>
    <p>Please wait</p>
  </div>

  <script>
    // ============================================================
    // REPLACE THIS WITH YOUR APPS SCRIPT WEB APP URL
    // ============================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzV2nYwwHqb57gn35sVT-g4s_63DoKAsNsQpYdRo_XSDQTlIfo9JaRpqPefuYLwEMNZ/exec";
    // ============================================================

    (function() {
      // Grab parameters from the current URL
      const params = new URLSearchParams(window.location.search);
      const bench = params.get("bench");
      const office = params.get("office");

      if (!bench || !office) {
        document.body.innerHTML = `
          <div>
            <div style="font-size:48px">❌</div>
            <strong style="color:red">Invalid QR Code</strong>
            <p>Missing worker information.</p>
          </div>`;
        return;
      }

      // Build the Apps Script URL with the same parameters
      const redirectUrl = APPS_SCRIPT_URL
        + "?bench=" + encodeURIComponent(bench)
        + "&office=" + encodeURIComponent(office);

      // Redirect immediately
      window.location.replace(redirectUrl);
    })();
  </script>
</body>
</html>
