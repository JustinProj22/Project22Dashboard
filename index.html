<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Project 22 — Factory Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black:     #0a0a0a;
    --dark:      #111111;
    --panel:     #1a1a1a;
    --border:    #2a2a2a;
    --orange:    #f5a623;
    --white:     #f0f0f0;
    --muted:     #666;
    --red:       #e04444;
    --green:     #4caf7d;
    --row-hover: #1c1c1c;
    --header-h:  56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    zoom: 75%;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
  }

  /* ══ TOP HEADER BAR ══════════════════════════════════════════ */
  .topbar {
    height: var(--header-h);
    background: var(--dark);
    border-bottom: 2px solid var(--orange);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
  }

  .topbar-logo {
    display: flex;
    align-items: center;
    overflow: visible;
  }
  .topbar-logo svg {
    height: 34px;
    width: auto;
    display: block;
    overflow: visible;
  }

  .topbar-clock {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--white);
    text-align: right;
    line-height: 1.1;
  }
  .topbar-clock .date-line {
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ══ MAIN LAYOUT ═════════════════════════════════════════════ */
  .dashboard {
    position: fixed;
    top: var(--header-h);
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 42% 58%;
  }

  /* ══ LEFT PANEL ══════════════════════════════════════════════ */
  .left-panel {
    display: grid;
    grid-template-rows: 52% 48%;
    border-right: 2px solid var(--border);
  }

  .cal-month {
    border-bottom: 2px solid var(--border);
    overflow: hidden;
  }
  .cal-month iframe {
    width: 100%; height: 100%;
    border: none;
    filter: invert(1) hue-rotate(180deg);
  }

  .cal-agendas {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .agenda-block {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--dark);
  }
  .agenda-block:first-child { border-right: 1px solid var(--border); }

  .agenda-label {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--orange);
    flex-shrink: 0;
  }

  .agenda-block iframe {
    flex: 1;
    width: 100%;
    border: none;
    filter: invert(1) hue-rotate(180deg);
  }

  /* ══ RIGHT PANEL — JOBS TABLE ════════════════════════════════ */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--black);
  }

  .jobs-header {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 2px solid var(--orange);
    flex-shrink: 0;
  }

  .jobs-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--orange);
  }

  .jobs-hint {
    font-size: 11px;
    color: var(--muted);
  }

  .jobs-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 20px;
    color: var(--muted);
    padding-bottom: 40px;
  }
  .spinner-wrap {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner-wrap svg {
    width: 56px;
    height: 56px;
    display: block;
    overflow: visible;
  }
  .spinner {
    width: 56px; height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner svg {
    width: 56px; height: 56px;
    display: block;
    overflow: visible;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  svg g[style*="animation"] {
    transform-box: fill-box;
    transform-origin: center center;
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    color: var(--orange);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 14px;
    text-align: left;
    border-bottom: 1px solid var(--orange);
    white-space: nowrap;
    z-index: 2;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:hover { background: var(--row-hover); }

  tbody td {
    padding: 9px 14px;
    vertical-align: middle;
    color: var(--white);
  }

  .cell-job, .cell-lists { cursor: pointer; transition: color 0.12s; }
  .cell-job:hover, .cell-lists:hover { color: var(--orange); }

  .cell-job::after, .cell-lists::after {
    content: ' ↗';
    font-size: 10px;
    opacity: 0;
    transition: opacity 0.12s;
    color: var(--orange);
  }
  .cell-job:hover::after, .cell-lists:hover::after { opacity: 1; }

  .no-date  { color: var(--red);   font-weight: 700; }
  .has-date { color: var(--green); font-weight: 500; }

  .jobs-body::-webkit-scrollbar       { width: 4px; }
  .jobs-body::-webkit-scrollbar-track { background: var(--dark); }
  .jobs-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* ══ MODAL ═══════════════════════════════════════════════════ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--dark);
    border: 1px solid var(--border);
    border-top: 3px solid var(--orange);
    border-radius: 4px;
    width: 100%;
    max-width: 1000px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(16px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
  }
  .modal-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px; height: 28px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    transition: all 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { border-color: var(--orange); color: var(--orange); }

  .modal-body {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 18px 18px;
    font-size: 13px;
    min-height: 120px;
  }

  .modal-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 48px 32px;
    color: var(--muted);
    overflow: visible;
    min-height: 120px;
  }
  .modal-loading .spinner { width: 28px; height: 28px; }

  .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .modal-table thead th {
    position: static;
    font-size: 11px;
    padding: 7px 10px;
    border-bottom-width: 1px;
  }
  .modal-table tbody td { padding: 8px 10px; }
  .modal-table tbody tr:last-child { border-bottom: none; }

  .status-yes { color: var(--green); font-size: 15px; }
  .status-no  { color: var(--red);   font-size: 15px; }

  .assigned-tag {
    background: rgba(245,166,35,0.12);
    color: var(--orange);
    border: 1px solid rgba(245,166,35,0.25);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
  }

  .empty-state {
    text-align: center; padding: 32px;
    color: var(--muted); font-style: italic;
  }
</style>
</head>

          </tr>
        </thead>
        <tbody id="main-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- ══ MODAL ═════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Job Details</div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-loading"><div class="spinner"></div> Loading…</div>
    </div>
  </div>
</div>

<script>
// ── Request fullscreen on load (hides TV Bro menu bar) ───────
window.addEventListener('load', function() {
  var el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen();
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.mozRequestFullScreen) {
    el.mozRequestFullScreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
});

// !! IMPORTANT: Replace this with your Apps Script deployment URL !!
var API_URL = 'https://script.google.com/macros/s/AKfycbxTmoObcFvEfZhukYX-F1mDOsgOIcZgvKy7bdIq6_SCcpS4YrPcVLXBNRYlgiaVmDcz/exec';

// ── Live clock ───────────────────────────────────────────────
function updateClock() {
  var now  = new Date();
  var h    = String(now.getHours()).padStart(2,'0');
  var m    = String(now.getMinutes()).padStart(2,'0');
  var s    = String(now.getSeconds()).padStart(2,'0');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-time').textContent = h + ':' + m + ':' + s;
  document.getElementById('clock-date').textContent =
    days[now.getDay()] + ' ' + now.getDate() + ' ' + mons[now.getMonth()] + ' ' + now.getFullYear();
}
updateClock();
setInterval(updateClock, 1000);

// ── Refresh calendars every hour ─────────────────────────────
setInterval(function() {
  ['cal1','cal2','cal3'].forEach(function(id) {
    var el = document.getElementById(id);
    el.src = el.src;
  });
}, 3600000);

// ── API fetch helper ─────────────────────────────────────────
function apiFetch(params, successFn, errorFn) {
  var url = API_URL + '?' + Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(successFn)
    .catch(errorFn || function(e) { console.error(e); });
}

// ── Load jobs table ──────────────────────────────────────────
loadJobs();
setInterval(loadJobs, 300000); // auto-refresh every 5 mins

function loadJobs() {
  apiFetch({ action: 'main' }, renderMain, function(e) {
    console.error('Failed to load jobs:', e);
  });
}

function renderMain(rows) {
  document.getElementById('main-loading').style.display = 'none';

  var tbody = document.getElementById('main-tbody');
  var table = document.getElementById('main-table');
  tbody.innerHTML = '';

  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:32px">No data found.</td></tr>';
    table.style.display = 'table';
    return;
  }

  rows.forEach(function(row) {
    var tr = document.createElement('tr');

    var tdJob = document.createElement('td');
    tdJob.className = 'cell-job';
    tdJob.textContent = row.job;
    tdJob.title = 'View all items for this job';
    tdJob.onclick = function() { openJobModal(row.job); };
    tr.appendChild(tdJob);

    var tdList = document.createElement('td');
    tdList.className = 'cell-lists';
    tdList.textContent = row.lists;
    tdList.title = 'View these specific list items';
    tdList.onclick = function() { openListModal(row.job, row.lists); };
    tr.appendChild(tdList);

    var tdDate = document.createElement('td');
    if (!row.delivery || row.delivery === '') {
      tdDate.innerHTML = '<strong class="no-date">No Date</strong>';
    } else {
      tdDate.innerHTML = '<span class="has-date">' + row.delivery + '</span>';
    }
    tr.appendChild(tdDate);

    tbody.appendChild(tr);
  });

  table.style.display = 'table';
}

// ── Modals ───────────────────────────────────────────────────
function openJobModal(jobName) {
  document.getElementById('modal-title').textContent = jobName;
  document.getElementById('modal-subtitle').textContent = 'All items for this job';
  showModal();
  apiFetch(
    { action: 'job', job: jobName },
    renderModal,
    function(e) { modalError(e); }
  );
}

function openListModal(jobName, listsStr) {
  document.getElementById('modal-title').textContent = jobName;
  document.getElementById('modal-subtitle').textContent = 'List items: ' + listsStr;
  showModal();
  apiFetch(
    { action: 'lists', job: jobName, lists: listsStr },
    renderModal,
    function(e) { modalError(e); }
  );
}

function renderModal(rows) {
  var body = document.getElementById('modal-body');

  if (!rows || rows.length === 0) {
    body.innerHTML = '<div class="empty-state">No matching items found in Active Jobs.</div>';
    return;
  }

  var html = '<table class="modal-table"><thead><tr>'
    + '<th>List #</th><th>Joinery Item</th><th>Listed</th>'
    + '<th>Machined</th><th>Assigned</th><th>Assembled</th>'
    + '<th>Delivered</th><th>Date Required</th>'
    + '</tr></thead><tbody>';

  rows.forEach(function(r) {
    html += '<tr>'
      + '<td>' + esc(r.list) + '</td>'
      + '<td>' + esc(r.item) + '</td>'
      + '<td>' + icon(r.listed)       + '</td>'
      + '<td>' + icon(r.machined)     + '</td>'
      + '<td>' + assigned(r.assigned) + '</td>'
      + '<td>' + icon(r.assembled)    + '</td>'
      + '<td>' + icon(r.delivered)    + '</td>'
      + '<td>' + (r.dateReq ? esc(r.dateReq) : '<span style="color:var(--muted)">—</span>') + '</td>'
      + '</tr>';
  });

  body.innerHTML = html + '</tbody></table>';
}

function icon(val) {
  if (val === true)  return '<span class="status-yes">✓</span>';
  if (val === false) return '<span class="status-no">✗</span>';
  var s = String(val).trim().toLowerCase();
  if (s === 'true'  || s === '✓' || s === 'yes' || s === '1') return '<span class="status-yes">✓</span>';
  if (s === 'false' || s === '✗' || s === 'no'  || s === '0' || s === '') return '<span class="status-no">✗</span>';
  return '<span style="color:var(--muted)">—</span>';
}

function assigned(val) {
  if (!val || String(val).trim() === '') return '<span style="color:var(--muted)">—</span>';
  return '<span class="assigned-tag">' + esc(val) + '</span>';
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showModal() {
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-loading"><svg viewBox="0 0 752.81335 649.14667" xmlns="http://www.w3.org/2000/svg" width="36" height="36"><g style="transform-origin:371.667px 324.613px;animation:spin 1s linear infinite"><path d="m 5575.45,4033.52 c -78.75,258.2 -212.91,461.98 -402.69,611.25 -186.16,149.25 -407.08,223.88 -662.75,223.88 H 1423.35 L 667.332,3784.76 H 4224.35 c 146.3,2.33 255.3,-53.3 327.07,-167.05 74.81,-106.6 96.57,-248.74 65.27,-426.42 -30.07,-170.61 -102.01,-312.75 -215.67,-426.45 -110.21,-104.29 -238.82,-159.95 -385.94,-167.03 H 458.047 L 0,0 h 1010.11 l 268.21,1521.02 h 2641.45 c 255.62,0 502.64,73.4 741.05,220.33 242.39,149.25 447.31,351.82 614.89,607.69 171.55,258.19 284.12,538.94 337.62,842.25 53.87,305.61 41.24,586.36 -37.88,842.23" fill="#ffffff" fill-rule="nonzero" stroke="none" transform="matrix(0.13333333,0,0,-0.13333333,0,649.14667)"/><path d="M 1428.74,9.17969 H 4883.25 L 5072.5,1082.39 H 1617.98 L 1428.74,9.17969" fill="#f9a72b" fill-rule="nonzero" stroke="none" transform="matrix(0.13333333,0,0,-0.13333333,0,649.14667)"/></g></svg> Loading…</div>';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function modalError(e) {
  document.getElementById('modal-body').innerHTML =
    '<div class="empty-state" style="color:var(--red)">Error loading data. Check API_URL is set correctly.</div>';
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
